    <!-- Main Content Canvas -->
    <main
      class="flex-1 max-w-3xl mx-auto w-full px-container-margin-mobile md:px-container-margin-desktop py-stack-lg flex flex-col gap-stack-lg"
    >
      <!-- Profile Identity Card -->
      <div

        <div

        <div

      </div>

      <!-- Direcciones Guardadas -->
      <div
        class="bg-surface-container-lowest border border-outline-variant shadow-sm rounded-xl overflow-hidden"
      >
        <div
          class="px-stack-md py-stack-sm border-b border-outline-variant bg-surface flex justify-between items-center"
        >
          <h3
            class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-2"

          </h3>
          <button

        </div>
        <div id="saved-locations-container" class="flex flex-col"></div>
      </div>

      <!-- Servicios Guardados -->
      <div
        class="bg-surface-container-lowest border border-outline-variant shadow-sm rounded-xl overflow-hidden mt-4"
      >
        <div
          class="px-stack-md py-stack-sm border-b border-outline-variant bg-surface flex justify-between items-center"
        >
          <h3
            class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-2"

              >bookmark</span

            Servicios Guardados

          <!-- Injected via JS -->

      <!-- Cerrar Sesión -->

          Cerrar Sesión

      <!-- Modal: Editar Ubicación -->
      <div
        id="edit-location-modal"

      >
        <div
          class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-2xl p-6 w-full max-w-sm flex flex-col gap-4 transform scale-95 transition-transform duration-300"
          id="edit-location-content"
        >
          <div
            class="flex justify-between items-center border-b border-outline-variant pb-3 shrink-0"
          >
            <h3
              class="font-headline-sm text-headline-sm text-on-surface font-bold"
            >
              Editar Ubicación
            </h3>
            <button
              id="close-edit-location"
              class="text-on-surface-variant hover:text-on-surface flex items-center justify-center bg-surface-container-high rounded-full p-1"

              <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
          </div>
          <div class="flex flex-col gap-3">
            <input type="hidden" id="edit-location-id" />
            <div class="flex flex-col gap-1">
              <label class="font-label-md text-on-surface"
                >Nombre (ej. Casa, Trabajo)</label
              >
              <input
                id="edit-location-label"
                type="text"
                class="w-full border border-outline-variant rounded-lg p-2 bg-surface-container-lowest text-on-surface focus:outline-none focus:border-secondary"
              />
            </div>
            <div class="flex flex-col gap-1">
              <label class="font-label-md text-on-surface">Dirección</label>
              <input
                id="edit-location-address"
                type="text"
                class="w-full border border-outline-variant rounded-lg p-2 bg-surface-container-lowest text-on-surface focus:outline-none focus:border-secondary"
              />
            </div>
          </div>
          <button
            id="save-edit-location-btn"
            class="w-full bg-secondary text-on-secondary font-label-lg py-3 rounded-lg hover:opacity-90 active:scale-98 transition-all font-semibold mt-2"

            Guardar Cambios
          </button>

    <!-- Barra de Navegación Inferior (Visible en Móvil) -->
    <nav
      class="md:hidden fixed bottom-0 w-full z-50 shadow-[0_-4px_12px_0px_rgba(0,0,0,0.04)] bg-surface-container-lowest flex justify-around items-center h-16 px-2 pb-safe border-t border-outline-variant"
    >
      <a
        href="/mapa_de_b_squeda_cliente/index.html"
        class="flex flex-col items-center justify-center text-on-surface-variant hover:text-secondary active:scale-95 transition-transform duration-150 w-[72px]"
      >
        <span class="material-symbols-outlined">map</span>
        <span class="font-label-md text-label-md mt-1">Explorar</span>
      </a>
      <a
        href="/centro_de_mensajer_a/index.html"
        class="flex flex-col items-center justify-center text-on-surface-variant hover:text-secondary active:scale-95 transition-transform duration-150 w-[72px]"
      >
        <span class="material-symbols-outlined">chat</span>
        <span class="font-label-md text-label-md mt-1">Mensajes</span>
      </a>
      <a
        href="/perfil_del_cliente/index.html"
        class="flex flex-col items-center justify-center text-on-secondary-container bg-secondary-container rounded-xl px-4 py-1 active:scale-95 transition-transform duration-150 w-[72px]"
      >
        <span
          class="material-symbols-outlined"
          style="font-variation-settings: &quot;FILL&quot; 1"
          >person</span
        >
        <span class="font-label-md text-label-md font-bold mt-1">Perfil</span>
      </a>
    </nav>

    <script type="module">
      import { supabase } from "/src/supabase.js";
      import {
        getUserProfile,
        updateUserProfile,
        getUserLocations,
        deleteUserLocation,
        updateUserLocation,
        getSavedProviders,
        toggleSavedProvider,
      } from "/src/data.js";

      // Auth Guard to prevent unauthorized access
      const checkAuth = async () => {
        let authorized = false;
        try {
          const {
            data: { session },
          } = await supabase.auth.getSession();
          if (session) {
            authorized = true;
            const userRole = session.user.user_metadata.role || "customer";
            if (!localStorage.getItem("user_role")) {
              localStorage.setItem("user_role", userRole);
            }
          } else {
            if (localStorage.getItem("user_role")) {
              authorized = true;
            }
          }
        } catch (_) {
          if (localStorage.getItem("user_role")) authorized = true;
        }

        if (!authorized) {
          window.location.replace("/index.html");
        } else {
          document.body.style.display = "flex";
        }
      };
      await checkAuth();

      let activeUserId = null;

      // DOM Elements
      const avatarImg = document.querySelector(
        'img[alt="User profile avatar"]',
      );
      const photoImg = document.querySelector('img[alt="Customer Photo"]');
      const nameText = document.getElementById("profile-name");
      const emailText = document.querySelector(
        ".font-body-md.text-on-surface-variant",
      );

      const nameDisplayContainer = document.getElementById(
        "name-display-container",
      );
      const nameEditContainer = document.getElementById("name-edit-container");
      const nameEditInput = document.getElementById("name-edit-input");
      const editNameBtn = document.getElementById("edit-name-btn");
      const saveNameBtn = document.getElementById("save-name-btn");
      const cancelNameBtn = document.getElementById("cancel-name-btn");

      const photoEditContainer = document.getElementById(
        "photo-edit-container",
      );
      const photoEditInput = document.getElementById("photo-edit-input");
      const editPhotoBtn = document.getElementById("edit-photo-btn");
      const savePhotoBtn = document.getElementById("save-photo-btn");
      const cancelPhotoBtn = document.getElementById("cancel-photo-btn");

      async function loadProfile() {
        try {
          const {
            data: { user },
          } = await supabase.auth.getUser();
          if (user) {
            activeUserId = user.id;

            const profile = await getUserProfile(user.id);
            if (profile) {
              if (avatarImg) avatarImg.src = profile.avatar_url;
              if (photoImg) photoImg.src = profile.avatar_url;
              if (nameText) nameText.innerText = profile.name;
              if (emailText) emailText.innerText = profile.email;
              if (nameEditInput) nameEditInput.value = profile.name;
              // Cannot set .value of type="file" programmatically
            }
          } else {
            throw new Error("No active user session");
          }
        } catch (e) {
          console.warn("Using local profile fallback:", e.message);
          activeUserId = "201"; // Fallback user ID
          try {
            const profile = await getUserProfile(activeUserId);
            if (profile) {
              if (avatarImg) avatarImg.src = profile.avatar_url;
              if (photoImg) photoImg.src = profile.avatar_url;
              if (nameText) nameText.innerText = profile.name;
              if (emailText) emailText.innerText = profile.email;
              if (nameEditInput) nameEditInput.value = profile.name;
              // Cannot set .value of type="file" programmatically for security reasons
            }
          } catch (fallbackErr) {
            console.error("Error cargando perfil de fallback:", fallbackErr);
            // Set default hardcoded values if even the fallback throws
            if (avatarImg) avatarImg.src = "https://i.pravatar.cc/150?u=201";
            if (photoImg) photoImg.src = "https://i.pravatar.cc/150?u=201";
            if (nameText) nameText.innerText = "Cliente de Prueba";
            if (emailText) emailText.innerText = "cliente@ejemplo.cl";
          }
        }
      }

      // Inline edit handlers
      if (editNameBtn) {
        editNameBtn.addEventListener("click", () => {
          nameDisplayContainer.classList.add("hidden");
          nameEditContainer.classList.remove("hidden");
          nameEditInput.focus();
        });
      }

      if (cancelNameBtn) {
        cancelNameBtn.addEventListener("click", () => {
          nameEditContainer.classList.add("hidden");
          nameDisplayContainer.classList.remove("hidden");
          if (nameText) nameEditInput.value = nameText.innerText;
        });
      }

      if (saveNameBtn) {
        saveNameBtn.addEventListener("click", async () => {
          const newName = nameEditInput.value.trim();
          if (!newName) {
            alert("El nombre no puede estar vacío.");
            return;
          }

          try {
            await updateUserProfile(activeUserId, { name: newName });
            if (nameText) nameText.innerText = newName;

            nameEditContainer.classList.add("hidden");
            nameDisplayContainer.classList.remove("hidden");
          } catch (err) {
            console.error("Error al actualizar perfil:", err);
            alert("Hubo un error al actualizar el nombre.");
          }
        });
      }
      if (editPhotoBtn) {
        editPhotoBtn.addEventListener("click", () => {
          nameDisplayContainer.classList.add("hidden");
          photoEditContainer.classList.remove("hidden");
          photoEditInput.focus();
        });
      }

      if (cancelPhotoBtn) {
        cancelPhotoBtn.addEventListener("click", () => {
          photoEditContainer.classList.add("hidden");
          nameDisplayContainer.classList.remove("hidden");
          if (photoImg) photoEditInput.value = photoImg.src;
        });
      }

      const fileToDataUrl = (file) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      };

      if (savePhotoBtn) {
        savePhotoBtn.addEventListener("click", async () => {
          const file = photoEditInput.files[0];
          if (!file) {
            alert("Por favor selecciona una imagen de tu galería.");
            return;
          }

          if (!file.type.startsWith("image/")) {
            alert(
              "Por seguridad, solo se permiten archivos de imagen (JPG, PNG, etc).",
            );
            return;
          }

          try {
            const newPhotoUrl = await fileToDataUrl(file);
            await updateUserProfile(activeUserId, { avatar_url: newPhotoUrl });
            if (photoImg) photoImg.src = newPhotoUrl;
            if (avatarImg) avatarImg.src = newPhotoUrl;

            photoEditContainer.classList.add("hidden");
            nameDisplayContainer.classList.remove("hidden");
          } catch (err) {
            console.error("Error al actualizar foto:", err);
            alert("Hubo un error al actualizar la foto de perfil.");
          }
        });
      }

      // Sign out function bound globally
      window.signOut = async () => {
        try {
          await supabase.auth.signOut();
        } catch (e) {
          console.log("Error de Supabase Auth signOut, procediendo localmente");
        }
        localStorage.removeItem("user_role");
        window.location.href = "/bienvenida_y_registro/index.html";
      };

      // Account Settings Modal Handlers
      const settingsModal = document.getElementById("settings-modal");
      const accountSettingsBtn = document.getElementById(
        "account-settings-btn",
      );
      const closeSettingsModalBtn = document.getElementById(
        "close-settings-modal",
      );
      const cancelSettingsBtn = document.getElementById("cancel-settings-btn");
      const saveSettingsBtn = document.getElementById("save-settings-btn");
      const modalNameInput = document.getElementById("modal-name-input");
      const modalPhotoInput = document.getElementById("modal-photo-input");

      if (accountSettingsBtn && settingsModal) {
        accountSettingsBtn.addEventListener("click", () => {
          if (modalNameInput && nameText)
            modalNameInput.value = nameText.innerText;
          if (modalPhotoInput && photoImg) modalPhotoInput.value = photoImg.src;

          settingsModal.classList.remove("hidden");
          settingsModal.classList.add("flex");
        });
      }

      const hideSettingsModal = () => {
        if (settingsModal) {
          settingsModal.classList.remove("flex");
          settingsModal.classList.add("hidden");
        }
      };

      if (closeSettingsModalBtn)
        closeSettingsModalBtn.addEventListener("click", hideSettingsModal);
      if (cancelSettingsBtn)
        cancelSettingsBtn.addEventListener("click", hideSettingsModal);

      if (settingsModal) {
        settingsModal.addEventListener("click", (e) => {
          if (e.target === settingsModal) hideSettingsModal();
        });
      }

      if (saveSettingsBtn) {
        saveSettingsBtn.addEventListener("click", async () => {
          const newName = modalNameInput.value.trim();
          const file = modalPhotoInput.files[0];

          if (!newName) {
            alert("El nombre no puede estar vacío.");
            return;
          }

          if (file && !file.type.startsWith("image/")) {
            alert(
              "Por seguridad, solo se permiten archivos de imagen (JPG, PNG, etc).",
            );
            return;
          }

          saveSettingsBtn.innerText = "Guardando...";
          saveSettingsBtn.disabled = true;

          try {
            const updates = { name: newName };
            let newPhotoUrl = null;
            if (file) {
              newPhotoUrl = await fileToDataUrl(file);
              updates.avatar_url = newPhotoUrl;
            }

            await updateUserProfile(activeUserId, updates);

            if (nameText) nameText.innerText = newName;
            if (newPhotoUrl) {
              if (photoImg) photoImg.src = newPhotoUrl;
              if (avatarImg) avatarImg.src = newPhotoUrl;
            }

            hideSettingsModal();
            alert("¡Configuración de la cuenta guardada con éxito!");
          } catch (err) {
            console.error("Error al actualizar configuración:", err);
            alert("Hubo un error al guardar la configuración.");
          } finally {
            saveSettingsBtn.innerText = "Guardar";
            saveSettingsBtn.disabled = false;
          }
        });
      }

      // --- Locations Logic ---
      const locationsContainer = document.getElementById(
        "saved-locations-container",
      );
      let profileLocations = [];

      async function renderSavedLocations() {
        if (!activeUserId) {
          locationsContainer.innerHTML =
            '<div class="p-4 text-center text-error font-body-md">Error: activeUserId is null</div>';
          return;
        }
        try {
          profileLocations = await getUserLocations(activeUserId);
          if (!Array.isArray(profileLocations)) {
            locationsContainer.innerHTML =
              '<div class="p-4 text-center text-error font-body-md">Error: profileLocations no es un array (' +
              typeof profileLocations +
              ")</div>";
            return;
          }
          if (profileLocations.length === 0) {
            locationsContainer.innerHTML =
              '<div class="p-4 text-center text-on-surface-variant font-body-md">No tienes direcciones guardadas.</div>';
            return;
          }

          let html = "";
          profileLocations.forEach((loc) => {
            html += `
                        <div class="p-stack-md border-b border-outline-variant flex justify-between items-center hover:bg-surface-bright group">
                            <div class="flex flex-col flex-1">
                                <span class="font-label-lg text-label-lg text-on-surface">${loc.label || "Sin nombre"}</span>
                                <span class="font-body-sm text-body-sm text-on-surface-variant line-clamp-1">${loc.address || "Sin dirección"}</span>
                            </div>
                            <div class="flex items-center gap-1 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="editLoc(${loc.id})" class="text-on-surface-variant hover:text-secondary p-2 rounded-full transition-colors">
                                    <span class="material-symbols-outlined text-[20px]">edit</span>
                                </button>
                                <button onclick="delLoc(${loc.id})" class="text-on-surface-variant hover:text-error p-2 rounded-full transition-colors">
                                    <span class="material-symbols-outlined text-[20px]">delete</span>
                                </button>
                            </div>
                        </div>
                    `;
          });
          locationsContainer.innerHTML = html;
        } catch (err) {
          locationsContainer.innerHTML =
            '<div class="p-4 text-center text-error font-body-md">Error crítico cargando direcciones: ' +
            err.message +
            "</div>";
          console.error("Error loading locations", err);
        }
      }

      window.delLoc = async (id) => {
        if (confirm("¿Estás seguro de que deseas eliminar esta dirección?")) {
          await deleteUserLocation(id);
          await renderSavedLocations();
        }
      };

      const editModal = document.getElementById("edit-location-modal");
      const editContent = document.getElementById("edit-location-content");
      const editIdInput = document.getElementById("edit-location-id");
      const editLabelInput = document.getElementById("edit-location-label");
      const editAddressInput = document.getElementById("edit-location-address");
      const saveEditBtn = document.getElementById("save-edit-location-btn");

      window.editLoc = (id) => {
        const loc = profileLocations.find((l) => l.id == id);
        if (!loc) return;

        editIdInput.value = loc.id;
        editLabelInput.value = loc.label;
        editAddressInput.value = loc.address;

        editModal.classList.remove("hidden");
        editModal.classList.add("flex");
        setTimeout(() => {
          editModal.classList.remove("opacity-0");
          editContent.classList.remove("scale-95");
          editContent.classList.add("scale-100");
        }, 10);
      };

      const closeEditLocModal = () => {
        editModal.classList.add("opacity-0");
        editContent.classList.remove("scale-100");
        editContent.classList.add("scale-95");
        setTimeout(() => {
          editModal.classList.add("hidden");
          editModal.classList.remove("flex");
        }, 300);
      };

      document
        .getElementById("close-edit-location")
        .addEventListener("click", closeEditLocModal);

      saveEditBtn.addEventListener("click", async () => {
        const id = editIdInput.value;
        const label = editLabelInput.value.trim();
        const address = editAddressInput.value.trim();

        if (!label || !address) {
          alert("Completa todos los campos");
          return;
        }

        saveEditBtn.innerText = "Buscando dirección...";
        saveEditBtn.disabled = true;

        try {
          // Geo-search for new coordinates if address changed (simplified logic)
          const query = encodeURIComponent(address + ", Chile");
          const res = await fetch(
            `https://nominatim.openstreetmap.org/search?format=json&q=${query}&limit=1`,
          );
          const data = await res.json();

          let lat, lng;
          if (data && data.length > 0) {
            lat = parseFloat(data[0].lat);
            lng = parseFloat(data[0].lon);
          } else {
            alert("Ubicación aproximada guardada.");
            lat = -33.4489 + (Math.random() - 0.5) * 0.05;
            lng = -70.6693 + (Math.random() - 0.5) * 0.05;
          }

          await updateUserLocation(id, label, address, lat, lng);
          await renderSavedLocations();
          closeEditLocModal();
        } catch (err) {
          alert("Error guardando la dirección");
        } finally {
          saveEditBtn.innerText = "Guardar Cambios";
          saveEditBtn.disabled = false;
        }
      });

      // --- Saved Services Logic ---
      const savedServicesContainer = document.getElementById(
        "saved-services-container",
      );

      async function renderSavedServices() {
        if (!activeUserId) return;
        try {
          const savedProviders = getSavedProviders(activeUserId);
          if (!savedProviders || savedProviders.length === 0) {
            savedServicesContainer.innerHTML =
              '<div class="p-4 text-center text-on-surface-variant font-body-md">No tienes servicios guardados.</div>';
            return;
          }

          let html = "";
          savedProviders.forEach((provider) => {
            html += `
                        <div class="p-stack-md border-b border-outline-variant flex justify-between items-center hover:bg-surface-bright group">
                            <div class="flex items-center gap-3">
                                <img src="${provider.image}" alt="${provider.name}" class="w-12 h-12 rounded-full object-cover">
                                <div class="flex flex-col">
                                    <span class="font-label-lg text-label-lg text-on-surface">${provider.name}</span>
                                    <span class="font-body-sm text-body-sm text-on-surface-variant line-clamp-1">${provider.profession}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-1 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="window.location.href='/perfil_del_prestador/index.html?id=${provider.id}'" class="text-secondary hover:text-secondary-fixed p-2 rounded-full transition-colors" title="Ver Perfil">
                                    <span class="material-symbols-outlined text-[20px]">person_search</span>
                                </button>
                                <button onclick="removeSavedProvider('${provider.id}')" class="text-secondary hover:text-error p-2 rounded-full transition-colors" title="Quitar Guardado">
                                    <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">bookmark</span>
                                </button>
                            </div>
                        </div>
                    `;
          });
          savedServicesContainer.innerHTML = html;
        } catch (err) {
          savedServicesContainer.innerHTML =
            '<div class="p-4 text-center text-error font-body-md">Error cargando servicios guardados: ' +
            err.message +
            "</div>";
          console.error("Error loading saved services", err);
        }
      }

      window.removeSavedProvider = (providerId) => {
        const savedProviders = getSavedProviders(activeUserId);
        const provider = savedProviders.find((p) => p.id === providerId);
        if (provider) {
          toggleSavedProvider(activeUserId, provider);
          renderSavedServices();
        }
      };

      // Initialize
      loadProfile().then(() => {
        renderSavedLocations();
        renderSavedServices();
      });
    </script>
  </body>
</html>
